name: price-log-prod
services:
  backend:
    image: ${PRICELOG_IMAGE:?배포할 이미지가 필요합니다}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:?}
      PRICELOG_LOG_DIR: /var/log/pricelog
    ports:
      - "127.0.0.1:${PRICELOG_HTTP_PORT:-8080}:8080"
    volumes:
      - ${PRICELOG_DEPLOY_ROOT:?}/logs:/var/log/pricelog
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 4 http://localhost:8080/actuator/health |
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
networks:
  default:
    external: true
    name: ${PRICELOG_NETWORK:-price-log}
