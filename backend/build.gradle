plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.pricelog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = '10.21.4'
    def checkstyleJar = "checkstyle-${toolVersion}.jar"
    config = resources.text.fromArchiveEntry(
        configurations.checkstyle.filter { it.name == checkstyleJar }, 'google_checks.xml')
    configProperties = ['org.checkstyle.google.suppressionfilter.config':
        file('config/checkstyle/suppressions.xml').absolutePath]
    maxWarnings = 0
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def conventions = tasks.register('checkstyleConventions', Checkstyle) {
    description = 'Checks project Java conventions in production and test sources.'
    source(sourceSets.main.allJava, sourceSets.test.allJava)
    classpath = files()
    config = resources.text.fromFile('config/checkstyle/conventions.xml')
}

tasks.named('check') {
    dependsOn conventions
}
