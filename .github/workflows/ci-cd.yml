name: Price Log CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: price-log-main
  queue: max

env:
  APP_PATHS: >-
    backend/src/main backend/build.gradle backend/settings.gradle backend/gradle
    backend/gradlew backend/Dockerfile backend/gradle.properties
    deploy/compose.yaml deploy/deploy.sh .github/workflows/ci-cd.yml

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 백엔드 빌드 및 통합 테스트
        working-directory: backend
        run: ./gradlew build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프런트엔드 검사
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: 앱 배포 대상 변경 확인
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read -r -a paths <<< "$APP_PATHS"
          deploy=true
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
             git diff --quiet "$BEFORE" HEAD -- "${paths[@]}"; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: 검증한 실행 JAR 전달
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-jar
          path: |
            backend/build/libs/*.jar
            !backend/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: ci
    if: needs.ci.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 현재 main의 앱 버전인지 확인
        run: |
          # 실패한 배포 잡만 다시 실행해도 더 새로운 운영 버전을 덮어쓰지 않는다.
          read -r -a paths <<< "$APP_PATHS"
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git diff --quiet HEAD origin/main -- "${paths[@]}"; then
            echo "::error::main에 더 새로운 앱 변경이 있습니다. 최신 릴리스에서 배포하세요."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: boot-jar
          path: image-context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR에 검증한 이미지 발행
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          metadata="$RUNNER_TEMP/image.json"
          docker buildx build image-context -f backend/Dockerfile \
            --platform linux/amd64,linux/arm64 -t "$repo:$GITHUB_SHA" \
            --metadata-file "$metadata" --push
          digest=$(jq -er '."containerimage.digest"' "$metadata")
          echo "ref=$repo@$digest" >> "$GITHUB_OUTPUT"

      - name: 서버에 릴리스 전달 및 수집기 교체
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          release="price-log/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -C deploy -czf - compose.yaml deploy.sh |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" \
              -i "$key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; cd; mkdir -p '$release'; cd '$release'; tar -xzf -; bash deploy.sh '$IMAGE'"
